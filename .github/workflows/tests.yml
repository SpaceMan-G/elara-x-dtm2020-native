name: tests

on:
  push:
  pull_request:

jobs:
  public-spec-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tests/atmospheric/test_dtm2020_external_resource_boundary.py
      - run: python tests/atmospheric/test_dtm2020_public_kernel.py
      - run: python tests/atmospheric/test_dtm2020_public_interface.py
