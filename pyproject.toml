[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elara-x-dtm2020-native"
version = "0.1.0.dev0"
description = "Licence-safe public-specification companion for Elara X DTM2020"
requires-python = ">=3.10"
authors = [
  {name = "Giuseppe A. A. Joulianou"}
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["elara_x*"]
